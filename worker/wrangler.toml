# Cloudflare Worker для Telegram-сповіщень Lesson Guard.
# Деплой лише з GitHub Actions (.github/workflows/deploy.yml).
name = "lesson-guard"
main = "src/index.ts"
tsconfig = "tsconfig.json"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "lesson-guard"
# Плейсхолдер: workflow замінює його значенням змінної репозиторію
# CLOUDFLARE_D1_DATABASE_ID перед кожним запуском wrangler. Не комітьте сюди справжній ID.
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

# Секрети (задаються в CI через wrangler-action, локально — у .dev.vars):
#   TELEGRAM_BOT_TOKEN
#   (секрет вебхука виводиться з токена — див. src/index.ts)

# Перевірка Єдиної школи й Google Класу → Telegram (src/check.ts).
# Щогодини о :17 з 04:17 до 20:17 UTC (≈ 6:17/7:17 – 22:17/23:17 за Києвом).
[triggers]
crons = ["17 4-20 * * *"]
