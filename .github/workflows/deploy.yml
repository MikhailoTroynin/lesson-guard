name: Deploy Worker

# Cloudflare Worker (каталог worker/) + база D1.
#
# • push у main зі змінами в worker/ → деплой Worker (міграції НЕ застосовуються);
# • Run workflow → action = deploy  → деплой вручну;
# • Run workflow → action = migrate → застосувати міграції D1 (worker/migrations);
# • Run workflow → action = link-code (+ ім'я дитини, клас) → створити дитину, якщо
#   її ще немає, і одноразовий код для /link. Код показується лише в Job Summary.
#
# Потрібно в Settings → Secrets and variables → Actions:
#   secrets:   CLOUDFLARE_API_TOKEN, TELEGRAM_BOT_TOKEN
#   variables: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID
#
# Після деплою вебхук Telegram реєструється автоматично (worker/scripts/set-webhook.mjs);
# секрет вебхука виводиться з токена бота, окремий secret не потрібен.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Що зробити'
        type: choice
        options:
          - deploy
          - migrate
          - link-code
        default: deploy
      child_name:
        description: "link-code: ім'я дитини"
        type: string
        required: false
      child_class:
        description: 'link-code: клас (наприклад, 7-А), необовʼязково'
        type: string
        required: false

permissions:
  contents: read

# Деплой і міграції не виконуються паралельно; запущене не скасовується.
concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.158.0'

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Insert D1 database ID into wrangler.toml
        env:
          D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if ! [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Змінна CLOUDFLARE_D1_DATABASE_ID порожня або не схожа на UUID."
            exit 1
          fi
          sed -i "s/__D1_DATABASE_ID__/${D1_ID}/" wrangler.toml
          if grep -q "__D1_DATABASE_ID__" wrangler.toml; then
            echo "::error::Плейсхолдер __D1_DATABASE_ID__ не замінено."
            exit 1
          fi

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: worker
          # Секрети завантажуються через `wrangler secret bulk` (значення йдуть
          # через stdin і маскуються GitHub) ще до деплою.
          secrets: |
            TELEGRAM_BOT_TOKEN
          command: deploy

      - name: Register Telegram webhook
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/set-webhook.mjs

  migrate:
    # Лише вручну: Actions → Deploy Worker → Run workflow → action = migrate.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Insert D1 database ID into wrangler.toml
        env:
          D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if ! [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Змінна CLOUDFLARE_D1_DATABASE_ID порожня або не схожа на UUID."
            exit 1
          fi
          sed -i "s/__D1_DATABASE_ID__/${D1_ID}/" wrangler.toml
          if grep -q "__D1_DATABASE_ID__" wrangler.toml; then
            echo "::error::Плейсхолдер __D1_DATABASE_ID__ не замінено."
            exit 1
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: worker
          command: |
            d1 migrations list lesson-guard --remote
            d1 migrations apply lesson-guard --remote

  link-code:
    # Лише вручну: Actions → Deploy Worker → Run workflow → action = link-code.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'link-code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Скрипт без залежностей; ім'я й клас передаються лише через env.
      # Адмін-токен виводиться з TELEGRAM_BOT_TOKEN (HMAC з іншою міткою, ніж секрет вебхука).
      # Код записується тільки в Job Summary, у лог не виводиться.
      - name: Create link code
        env:
          CHILD_NAME: ${{ inputs.child_name }}
          CHILD_CLASS: ${{ inputs.child_class }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/link-code.mjs
