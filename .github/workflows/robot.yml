name: Robot

# Хмарний робот: браузер (Playwright) заходить у «Єдину школу» і Google Клас
# акаунтом дитини, збирає оцінки й завдання і передає їх Cloudflare Worker'у.
# Логін/пароль Єдиної школи і сесію Google робот бере з Worker'а — їх вводять
# на сторінці налаштувань (https://mikhailotroynin.github.io/lesson-guard/settings).
#
# Секрети (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN — уже є (з нього виводиться токен робота для Worker'а)
#   ROBOT_PASSPHRASE   — необов'язково: лише щоб шифрувати скріншоти в режимі debug
# Змінна WORKER_URL — необов'язково, якщо адреса Worker'а інша, ніж типова.

on:
  schedule:
    # Щогодини з 07:23 до 22:23 за Києвом (cron — у UTC).
    - cron: '23 4-19 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Зберегти скріншоти сторінок (потрібен секрет ROBOT_PASSPHRASE — ним шифрується архів)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run robot
        id: robot
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          DEBUG_DIR: ${{ inputs.debug && 'robot-debug' || '' }}
          ROBOT_CHANNEL: chrome
        run: npm run robot

      - name: Encrypt debug screenshots
        id: debug
        if: inputs.debug && hashFiles('robot-debug/**') != ''
        env:
          ROBOT_PASSPHRASE: ${{ secrets.ROBOT_PASSPHRASE }}
        run: |
          if [ -z "$ROBOT_PASSPHRASE" ]; then
            echo "::warning::Скріншоти не збережено: задайте секрет ROBOT_PASSPHRASE (ним шифрується архів, бо репозиторій публічний)."
            exit 0
          fi
          tar czf robot-debug.tgz robot-debug
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ROBOT_PASSPHRASE -in robot-debug.tgz -out robot-debug.tgz.enc
      - uses: actions/upload-artifact@v4
        if: inputs.debug && hashFiles('robot-debug.tgz.enc') != ''
        with:
          name: robot-debug-encrypted
          path: robot-debug.tgz.enc
          retention-days: 3

      - name: Fail if a source could not be read
        if: steps.robot.outcome != 'success'
        run: |
          echo "::error::Робот не зміг прочитати одне з джерел — подробиці в кроці «Run robot»."
          exit 1
