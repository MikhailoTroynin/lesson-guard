name: Deploy demo to GitHub Pages

# Збирає веб-демо і викладає його в гілку gh-pages.
# У Settings → Pages має бути: Deploy from a branch → gh-pages → / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export:web
      - name: SPA fallback and no Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Push to gh-pages branch
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
