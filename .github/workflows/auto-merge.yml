name: Auto-merge to main

# Кожен push у будь-яку гілку (крім main) після успішних перевірок
# автоматично вливається в main, а потім запускається деплой GitHub Pages
# та збірка APK.
on:
  push:
    branches:
      - '**'
      - '!main'
      - '!gh-pages'

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Web build (demo)
        run: npm run export:web

  merge:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$BRANCH"
          git checkout -B main origin/main
          if git merge --ff-only "origin/$BRANCH"; then
            echo "Fast-forward main → $BRANCH"
          else
            git merge --no-ff "origin/$BRANCH" -m "Auto-merge $BRANCH into main"
          fi
          git push origin main
      # Push, зроблений через GITHUB_TOKEN, не запускає інші workflow,
      # тому деплой Pages і збірку APK запускаємо явно.
      - name: Deploy GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Build Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main --repo "$GITHUB_REPOSITORY"
