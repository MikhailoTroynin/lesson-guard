name: Auto-merge to main

# Кожен push у будь-яку гілку (крім main, gh-pages, robot-data і setup/**) після успішних перевірок
# автоматично вливається в main, а потім запускається деплой GitHub Pages.
on:
  push:
    branches:
      - '**'
      - '!main'
      - '!gh-pages'
      - '!robot-data'
      # Інфраструктурні гілки (Cloudflare тощо) мерджаться лише вручну через PR.
      - '!setup/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Web build
        run: npm run export:web

  merge:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge branch into main
        id: merge
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          if ! git fetch origin main; then
            echo "main ще не існує — створюю її з $BRANCH"
            git push origin "origin/$BRANCH:refs/heads/main"
            exit 0
          fi
          git checkout -B main origin/main
          OLD=$(git rev-parse HEAD)
          if git merge --ff-only "origin/$BRANCH"; then
            echo "Fast-forward main → $BRANCH"
          else
            git merge --no-ff "origin/$BRANCH" -m "Auto-merge $BRANCH into main"
          fi
          git push origin main
          # Чи змінився код Worker'а (або спільний код, який він використовує)?
          if ! git diff --quiet "$OLD" HEAD -- worker src/core src/providers .github/workflows/deploy.yml; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          fi
      # Push, зроблений через GITHUB_TOKEN, не запускає інші workflow,
      # тому деплой Pages запускаємо явно.
      - name: Deploy GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
      # Деплой Worker'а (Cloudflare) — лише якщо змінився його код.
      - name: Deploy Worker
        if: steps.merge.outputs.worker == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY" -f action=deploy
